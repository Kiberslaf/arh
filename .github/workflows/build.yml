name: Build Arch APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade buildozer cython
        
    - name: Build APK
      run: |
        buildozer init
        
        # Настраиваем buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/title = My Application/title = Arh/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = arh/' buildozer.spec
        sed -i 's/# icon.filename = %(source.dir)s\/data\/icon.png/icon.filename = %(source.dir)s\/icon.png/' buildozer.spec
        sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
        
        # Скачиваем СВЕЖИЙ Android Command Line Tools напрямую от Google
        mkdir -p ~/.buildozer/android/platform/android-sdk
        cd ~/.buildozer/android/platform/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
        
        # Создаем симлинк, чтобы Buildozer думал, что это старая папка tools
        ln -s cmdline-tools/latest tools
        
        # Запускаем сборку
        yes | buildozer -v android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Arch-APK
        path: bin/*.apk
